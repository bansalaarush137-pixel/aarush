<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Best Friend Fun Universe 💖</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body {
    margin: 0;
    overflow-x: hidden;
    font-family: 'Poppins', sans-serif;
    background: linear-gradient(135deg, #ff9a9e, #fad0c4, #fbc2eb);
    transition: background 1s ease;
}

.container {
    max-width: 500px;
    margin: 40px auto;
    background: white;
    padding: 25px;
    border-radius: 30px;
    text-align: center;
    box-shadow: 0 20px 50px rgba(0,0,0,0.25);
}

h1 {
    color: #ff4d6d;
    margin-bottom: 10px;
}

p {
    color: #555;
    font-size: 16px;
}

button {
    padding: 14px 25px;
    margin: 10px;
    border: none;
    border-radius: 40px;
    font-size: 16px;
    cursor: pointer;
    background: linear-gradient(135deg, #ff4d6d, #c77dff);
    color: white;
    transition: 0.3s;
}

button:hover {
    transform: scale(1.12);
}

.section {
    display: none;
    margin-top: 20px;
}

.big-emoji {
    font-size: 50px;
    animation: bounce 1s infinite alternate;
}

@keyframes bounce {
    from { transform: translateY(0); }
    to { transform: translateY(-12px); }
}

/* Flying emoji */
.emoji {
    position: fixed;
    font-size: 28px;
    animation: fly 4s linear forwards;
    pointer-events: none;
}

@keyframes fly {
    0% { transform: translate(0,0) scale(1); opacity: 1; }
    100% { transform: translate(var(--x), var(--y)) scale(0.5); opacity: 0; }
}
</style>
</head>

<body>

<audio id="music" loop>
    <source src="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3" type="audio/mpeg">
</audio>

<div class="container">
    <h1>Hey siddhi 💕</h1>
    <p>This whole universe is made just for YOU 😌✨</p>

    <button onclick="start()">Start the Fun 🚀</button>

    <div class="section" id="sec1">
        <p>You are not just a friend…<br><b>You are my comfort person 🤍</b></p>
        <div class="big-emoji">🤝💖</div>
        <button onclick="next(2)">Next 😏</button>
    </div>

    <div class="section" id="sec2">
        <p>If being awesome was a job,<br>YOU would be the CEO 😎</p>
        <div class="big-emoji">👑🔥</div>
        <button onclick="changeMood()">Change Mood 🌈</button>
        <button onclick="next(3)">Next 😂</button>
    </div>

    <div class="section" id="sec3">
        <p>Quick Question 🤔<br>Am I your favorite human?</p>
        <button onclick="yes()">YES 😍</button>
        <button onclick="no()">Also YES 🙃</button>
    </div>

    <div class="section" id="sec4">
        <p>Correct Answer 😌💖<br>No refunds, no exchanges.</p>
        <div class="big-emoji">💘😎</div>
        <button onclick="emojiBlast()">EMOJI BLAST 💥</button>
    </div>
</div>

<script>
function start() {
    document.getElementById("music").play();
    document.getElementById("sec1").style.display = "block";
}

function next(n) {
    document.getElementById("sec" + (n-1)).style.display = "none";
    document.getElementById("sec" + n).style.display = "block";
}

function yes() {
    next(4);
}

function no() {
    next(4);
}

function changeMood() {
    const moods = [
        "linear-gradient(135deg, #ff9a9e, #fad0c4)",
        "linear-gradient(135deg, #a18cd1, #fbc2eb)",
        "linear-gradient(135deg, #fddb92, #d1fdff)",
        "linear-gradient(135deg, #c77dff, #ff4d6d)",
        "linear-gradient(135deg, #ffecd2, #fcb69f)"
    ];
    document.body.style.background = moods[Math.floor(Math.random() * moods.length)];
}

/* 1000 EMOJI FLYING MAGIC */
function emojiBlast() {
    const emojis = ["💖","😂","✨","🔥","😍","😎","🤍","🥰","🌈","🎉"];
    for (let i = 0; i < 2000; i++) {
        const e = document.createElement("div");
        e.className = "emoji";
        e.innerText = emojis[Math.floor(Math.random() * emojis.length)];
        e.style.left = Math.random() * window.innerWidth + "px";
        e.style.top = Math.random() * window.innerHeight + "px";
        e.style.setProperty("--x", (Math.random() * 600 - 300) + "px");
        e.style.setProperty("--y", (Math.random() * 600 - 300) + "px");
        document.body.appendChild(e);

        setTimeout(() => e.remove(), 4000);
    }
}
</script>

</body>
</html>
